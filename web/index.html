<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Cutoff is a dispute triage board for PayPal disputes. One Bryntum Scheduler row per case handler, work blocks against response deadlines, and an agent that reflows the board when the money changes." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cutoff, dispute triage board</title>
    <script>
      try { var t = localStorage.getItem('cutoff-theme'); document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
